<div *ngIf="loading" class="loader-overlay">
  <span class="loader"></span>
</div>
  <simple-notifications [options]="notificationOptions"></simple-notifications>
<app-admin-header></app-admin-header>

<!-- Table Card -->
<div class="bg-white rounded-2xl shadow-md border border-gray-200 p-4 md:p-8 mx-3 md:mx-6 my-6 md:my-8">
  <h2 class="text-2xl font-semibold text-gray-800 mb-4">
    Query
  </h2>

  <div class="w-full overflow-x-auto bg-white rounded-xl shadow">
    <table class="min-w-[900px] md:min-w-full text-left border-collapse">
      <thead>
        <tr class="border-b bg-gray-100">
          <th class="px-4 py-3">S.No</th>
          <th class="px-4 py-3">Name</th>
          <th class="px-4 py-3">Email</th>
          <th class="px-4 py-3">Subject</th>
          <th class="px-4 py-3">Message</th>
          <th class="px-4 py-3">Date</th>
          <th class="px-4 py-3">Action</th>
        </tr>
      </thead>

      <tbody>
      <tr *ngFor="let q of queries; let i = index" class="border-b hover:bg-gray-50">
        <td class="px-4 py-3">{{ i+1}}</td>
        <td class="px-4 py-3">{{ q.name }}</td>
        <td class="px-4 py-3">{{ q.mail }}</td>
        <td class="px-4 py-3">{{ q.subject }}</td>
        <td class="px-4 py-3">
          <span>
            {{
              q.message?.length > 40
                ? (q.message | slice:0:40) + '...'
                : q.message
            }}
          </span>

          <button
            *ngIf="q.message?.length > 40"
            (click)="openMessage(q.message)"
            class="ml-2 text-blue-600 hover:underline text-sm font-medium">
            View More
          </button>
        </td>
        <td class="px-4 py-3">
          {{ q.createdAt | date: 'dd MMM yyyy' }}
        </td>
        
        <td class="px-4 py-3">
          <div class="flex gap-2">
            <button (click)="deletedata(q.queryId)"
              class="w-10 h-10 flex items-center justify-center
                    bg-red-100 text-red-600
                    rounded-lg hover:bg-red-200 transition"
              title="Delete"
            >
              <i class="fa-solid fa-trash"></i>
            </button>

          </div>
        </td>
      </tr>

        <tr *ngIf="queries?.length === 0">
          <td colspan="6" class="text-center py-6 text-gray-500">
            No records found
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>


<!-- Message Modal -->
<div
  *ngIf="showMessageModal"
  class="fixed inset-0 backdrop-blur-sm bg-black/20 flex items-center justify-center z-50 p-4">

  <div class="bg-white rounded-xl shadow-xl w-full max-w-lg">

    <div class="flex justify-between items-center border-b p-4">
      <h3 class="text-lg font-semibold">
        Full Message
      </h3>

      <button
        (click)="closeMessage()"
        class="text-gray-500 hover:text-red-600 text-2xl">
        &times;
      </button>
    </div>

    <div class="p-4 max-h-[60vh] overflow-y-auto break-words">
      {{ selectedMessage }}
    </div>

    <div class="border-t p-4 flex justify-end">
      <button
        (click)="closeMessage()"
        class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
        Close
      </button>
    </div>

  </div>

</div>
