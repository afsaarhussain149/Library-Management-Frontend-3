<script src="https://cdn.tailwindcss.com"></script>

<div *ngIf="loading" class="loader-overlay">
  <span class="loader"></span>
</div>

<div class="min-h-screen flex">

  <!-- Left Section (Image) -->
  <div class="hidden md:flex w-2/5 bg-[#dff5dc] justify-center items-center">
    <img src="login.png" alt="Illustration" class="w-full h-full object-cover">
  </div>

  <!-- Right Section (Login + Register Flip Card) -->
  <div class="w-full md:w-3/5 flex justify-center items-center bg-gradient-to-br
    from-[#e9fce9] via-white to-[#dff5dc] relative p-4">

    <!-- Home Button -->
    <div class="absolute top-4 right-4 z-20">
      <button
        (click)="goToHome()"
        class="flex items-center gap-2 bg-white text-[#2ea862] border border-[#39d174]
              px-4 py-2 rounded-full shadow-md hover:bg-[#39d174]
              hover:text-white transition-all duration-300 text-sm md:text-base">

        <svg xmlns="http://www.w3.org/2000/svg"
            class="w-5 h-5"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor">
          <path stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M3 10.5L12 3l9 7.5M5 9.5V21h14V9.5"/>
        </svg>

        <span class="hidden sm:inline">Home</span>
      </button>
    </div>

    <div class="perspective w-full max-w-md flex justify-center items-center">

      <!-- Flip Container -->
      <div class="flip-container" [class.flipped]="isFlipped">

        <!-- ⭐ LOGIN FRONT SIDE -->
        <div class="front bg-white/60 backdrop-blur-xl rounded-3xl shadow-xl border border-white/40 p-8">

          <h2 class="text-3xl sm:text-4xl font-extrabold text-center mb-4 text-[#1c3125]">
            Welcome Back
          </h2>

          <p class="text-center text-gray-600 mb-8 text-sm">
            Log in to access your library dashboard
          </p>

          <div class="space-y-6">

            <!-- User ID -->
            <div>
              <label class="block text-gray-700 mb-2 font-medium text-base">User ID</label>
              <input
                type="text"
                    (input)="onPhoneInput($event)"

                placeholder="Enter your user ID"
                [(ngModel)]="email"
                class="w-full px-4 py-3 border border-gray-300 rounded-xl
                       focus:outline-none focus:ring-2 focus:ring-[#39d174] shadow-sm
                       transition-all duration-200 hover:shadow-md">
            </div>

            <!-- Password -->
            <div>
            <label class="block text-gray-700 mb-2 font-medium text-base">
              Password
            </label>

  <div class="relative">

      <input
        [type]="showPassword ? 'text' : 'password'"
        placeholder="Enter your password"
        [(ngModel)]="password"
        class="w-full px-4 py-3 pr-12 border border-gray-300 rounded-xl
              focus:outline-none focus:ring-2 focus:ring-[#39d174] shadow-sm
              transition-all duration-200 hover:shadow-md">

    <!-- Eye Icon -->
    <span
      (click)="showPassword = !showPassword"
      class="absolute right-4 top-1/2 -translate-y-1/2 cursor-pointer text-gray-500">

      <!-- Eye Open -->
      <svg *ngIf="!showPassword"
           xmlns="http://www.w3.org/2000/svg"
           class="h-5 w-5"
           fill="none"
           viewBox="0 0 24 24"
           stroke="currentColor">

        <path stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />

        <path stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M2.458 12C3.732 7.943 7.523 5 12 5
                 c4.477 0 8.268 2.943 9.542 7
                 -1.274 4.057-5.065 7-9.542 7
                 -4.477 0-8.268-2.943-9.542-7z" />
      </svg>

      <!-- Eye Closed -->
      <svg *ngIf="showPassword"
           xmlns="http://www.w3.org/2000/svg"
           class="h-5 w-5"
           fill="none"
           viewBox="0 0 24 24"
           stroke="currentColor">

        <path stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M13.875 18.825A10.05 10.05 0 0112 19
                 c-4.478 0-8.268-2.943-9.543-7
                 a9.97 9.97 0 012.223-3.592M6.228 6.228
                 A9.956 9.956 0 0112 5c4.478 0 8.268 2.943
                 9.543 7a9.97 9.97 0 01-4.293 5.077M15 12
                 a3 3 0 11-6 0 3 3 0 016 0zm6 6L3 3" />
      </svg>

    </span>

  </div>
</div>

            <!-- Remember me -->
            <div class="flex items-center justify-between text-sm text-gray-600">
              <label class="flex items-center space-x-2">
                <input type="checkbox" class="text-[#39d174] focus:ring-[#39d174]">
                <span>Remember me</span>
              </label>
              <p class="text-center text-gray-600 text-sm mt-3">
  <a (click)="flipToForgot()" class="text-[#39d174] font-medium hover:underline cursor-pointer">
    Forgot Password?
  </a>
</p>
            </div>


            <!-- Login Button -->
            <button
              type="submit"
              (click)="loginapi()"
              class="w-full bg-gradient-to-r from-[#39d174] to-[#2ea862]
                     text-white font-semibold py-3 rounded-full shadow-md
                     hover:shadow-lg hover:scale-[1.02] transition-all duration-300">
              Login
            </button>
          </div>

          <p class="text-center text-gray-600 text-sm mt-6">
            Don’t have an account?
            <a (click)="flipToRegister()" class="text-[#39d174] font-medium hover:underline cursor-pointer">
              Register
            </a>
          </p>
<p class="text-center text-gray-600 text-sm mt-4">
  Registered but unpaid?
  <a (click)="showUnpaidCard()"
     class="text-red-500 font-medium hover:underline cursor-pointer">
     Click Here
  </a>
</p>
        </div>

        <!-- ⭐ REGISTER BACK SIDE -->
        <div class="back bg-white/60 backdrop-blur-xl rounded-3xl shadow-xl border border-white/40 p-8">

          <h2 class="text-3xl sm:text-4xl font-extrabold text-center mb-4 text-[#1c3125]">
            Create Account
          </h2>

          <p class="text-center text-gray-600 mb-8 text-sm">
            Register to continue
          </p>

          <div class="space-y-6">

            <!-- Name -->
            <div>
              <label class="block text-gray-700 mb-2 font-medium text-base">Name</label>
               <input
    type="text"
    [(ngModel)]="username"
    name="username"
    placeholder="Enter your name"
    required
    class="w-full px-4 py-3 border border-gray-300 rounded-xl
           focus:outline-none focus:ring-2 focus:ring-[#39d174] shadow-sm
           transition-all duration-200 hover:shadow-md">
            </div>

            <!-- Phone -->
            <div>
              <label class="block text-gray-700 mb-2 font-medium text-base">Phone</label>
              <input
    type="tel"
    [(ngModel)]="phoneno"
    name="phone"
    placeholder="Enter your phone"
    required
    maxlength="10"
    pattern="[0-9]*"
    (input)="onPhoneInput($event)"
    class="w-full px-4 py-3 border border-gray-300 rounded-xl
           focus:outline-none focus:ring-2 focus:ring-[#39d174] shadow-sm
           transition-all duration-200 hover:shadow-md">
            </div>

            <!-- Register Button (no API now) -->
            <button
              type="submit" (click)="submitbasic()"
              class="w-full bg-gradient-to-r from-[#39d174] to-[#2ea862]
                     text-white font-semibold py-3 rounded-full shadow-md
                     hover:shadow-lg hover:scale-[1.02] transition-all duration-300">
              Register
            </button>
          </div>

          <p class="text-center text-gray-600 text-sm mt-6">
            Already have an account?
            <a (click)="flipToLogin()" class="text-[#39d174] font-medium hover:underline cursor-pointer">
              Login
            </a>
          </p>

        </div>

<br><br>
      </div>
    </div>
  </div>
</div>
