<div *ngIf="loading" class="loader-overlay">
  <span class="loader"></span>
</div>
  <simple-notifications [options]="notificationOptions"></simple-notifications>
<app-admin-header></app-admin-header>

<!-- Table Card -->
<div class="bg-white rounded-2xl shadow-md border border-gray-200 p-4 md:p-8 mx-3 md:mx-6 my-6 md:my-8">
  <h2 class="text-2xl font-semibold text-gray-800 mb-4">
    Fee Records of Student
  </h2>

  <div class="overflow-x-auto bg-white rounded-xl shadow">
    <table class="min-w-full text-left border-collapse">
      <thead>
        <tr class="border-b bg-gray-100">
          <th class="px-4 py-3">User ID</th>
          <th class="px-4 py-3">Student</th>
          <th class="px-4 py-3">Plan</th>
          <th class="px-4 py-3">Amount</th>
          <th class="px-4 py-3">Status</th>
          <th class="px-4 py-3">Date</th>
          <th class="px-4 py-3">Action</th>
        </tr>
      </thead>

      <tbody>
           <tr *ngFor="let u of users" class="border-b hover:bg-gray-50">
          <td class="px-4 py-3 font-medium">
            {{ u.userId }}
          </td>

          <td class="px-4 py-3 flex items-center gap-3">
            <img
              [src]="u.photo || 'assets/user.png'"
              class="w-10 h-10 rounded-full object-cover"
            />
            {{ u.fullName }}
          </td>

          <td class="px-4 py-3">
            {{ u.payment?.plan?.hours || '-' }} hrs
          </td>

          <td class="px-4 py-3">
            ₹{{ (u.payment?.amount || 0) / 100 }}
          </td>

          <td class="px-4 py-3">
            <span
              class="px-3 py-1 text-xs rounded-full"
              [ngClass]="{
                'bg-green-100 text-green-700': u.payment?.status === 'paid',
                'bg-yellow-100 text-yellow-700': u.payment?.status === 'created',
                'bg-blue-100 text-blue-700': u.payment?.status === 'pending',
                'bg-red-100 text-red-700': u.payment?.status === 'failed'
              }"
            >
              {{ u.payment?.status || 'N/A' }}
            </span>
          </td>

          <td class="px-4 py-3">
            {{ u.payment?.createdAt | date:'dd MMM yyyy' }}
          </td>

          <td class="px-4 py-3">
            <button class="px-4 py-2 bg-blue-200 rounded disabled:opacity-50"
            
              title="Approve Payment"
              (click)="viewUser(u)"
            >
Approve payment          </button>
          </td>
        </tr>
       
      </tbody>
    </table>
  </div>

  <!-- Pagination -->
  <div class="flex justify-between items-center mt-4">
    <button
      (click)="fetchpayment(page - 1)"
      [disabled]="page === 1"
      class="px-4 py-2 bg-gray-200 rounded disabled:opacity-50"
    >
      Prev
    </button>

    <span class="text-sm text-gray-600">
      Page {{ totalPages }} of {{ page }}
    </span>

    <button
      (click)="fetchpayment(page + 1)"
      [disabled]="page === totalPages"
      
    >
      Next
    </button>
  </div>
</div>
